# Phần do nghiệp vụ duyệt tay: câu hỏi mẫu, luồng hướng dẫn. Ưu tiên cao hơn nội dung quét từ code.
features:
  iconnect.assets:
    sampleQuestions:
      - bán trái phiếu ở đâu
      - cách bán lại trái phiếu trước hạn
      - xem trái phiếu đang nắm giữ
  iconnect.price-board:
    sampleQuestions:
      - xem bảng giá trái phiếu
      - mua trái phiếu iConnect ở đâu
  money.deposit:
    sampleQuestions:
      - nộp tiền vào tài khoản
      - nạp tiền chứng khoán
  iconnect.orders:
    sampleQuestions:
      - xem lệnh đã đặt
      - hủy lệnh trái phiếu
  iconnect.pnl:
    sampleQuestions:
      - xem lãi lỗ trái phiếu

tours:
  sell-bond:
    title: Bán trái phiếu trên iConnect
    description: Dẫn từ trang chủ tới nút BÁN trong danh mục trái phiếu đang nắm giữ.
    feature: iconnect.assets
    startRoute: /home
    steps:
      - target: home-shortcut-iconnect
        advanceOn: click
        text: "Bắt đầu từ trang chủ: bấm vào **Giao dịch iConnect** để vào bảng giá trái
          phiếu."
      - target: iconnect-tab-assets
        advanceOn: click
        text: "Đây là bảng giá iConnect. Chuyển sang tab **Tài sản** để xem trái phiếu
          đang nắm giữ."
      - target: assets-select-sell
        advanceOn: click
        text: "Bấm **CHỌN BÁN** để bật chế độ bán, mỗi trái phiếu sẽ hiện nút BÁN."
      - target: assets-sell-button
        text: "Bấm **BÁN** ở dòng trái phiếu muốn bán. Từ đây bạn tự nhập khối lượng,
          giá và xác nhận lệnh; trợ lý không đặt lệnh hộ."

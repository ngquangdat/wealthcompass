# Chủ đề bị chặn trước khi gọi LLM. Mẫu viết trên văn bản ĐÃ BỎ DẤU, chữ thường.
# Câu hỏi "ở đâu / cách làm" không bị chặn trừ khi khớp mẫu tư vấn rõ ràng.
topics:
